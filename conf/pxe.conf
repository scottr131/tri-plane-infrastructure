# dnsmasq-pxe.conf — PXE provisioning service for infrastructure stack
#
# Role: proxyDHCP + TFTP + boot steering. It does NOT hand out IP addresses — it
# only answers the PXE/boot questions and lets the EXISTING DHCP server on the
# LAN assign leases. (If there is NO other DHCP server, see the AUTHORITATIVE
# block at the bottom instead.)
#
# Install: drop in /etc/dnsmasq.d/ and `dnsmasq --conf-dir=/etc/dnsmasq.d`,
# or run `dnsmasq -C /path/to/dnsmasq-pxe.conf -d` while testing (-d = foreground).

# --- Select interface, and do NOT act as a DNS server --------------
interface=eth0                
#interface=eth1
port=0                         # disable dnsmasq's DNS; we only want DHCP-proxy+TFTP

# --- proxyDHCP on the management subnet ---------------------------------------
# "proxy" = coexist with the real DHCP server; answer boot info only.
# (Do NOT set bind-interfaces — proxyDHCP needs to see broadcast traffic.)
#dhcp-range=10.1.31.0,proxy
dhcp-range=10.168.1.0,proxy


# --- TFTP: serves the first-stage iPXE binary to firmware ---------------------
enable-tftp
tftp-root=/srv/tftp            # put ipxe.efi (or snponly.efi) here

# --- Classify clients ---------------------------------------------------------
# DHCP option 93 (client architecture): 7 and 9 = UEFI x86-64 (0 = legacy BIOS).
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
# iPXE advertises itself with option 175 — tag it so we don't loop forever.
dhcp-match=set:ipxe,175

# --- Two-stage boot -----------------------------------------------------------
# Stage 1: UEFI firmware that is NOT yet iPXE - chainload iPXE over TFTP.
pxe-service=tag:efi64,tag:!ipxe,x86-64_EFI,"Chainload iPXE",ipxe.efi
# Stage 2: the client is now iPXE - hand it our HTTP boot script.
dhcp-boot=tag:ipxe,http://10.168.1.100/boot.ipxe

# --- Logging (very helpful while bringing this up) ----------------------------
log-dhcp

# ============================================================================
# ALTERNATIVE: deploy node CAN be authorative. If it is the ONLY DHCP server
# on this LAN, comment out the
#    `dhcp-range=...,proxy` 
# line above and use an authoritative range instead, e.g.:
#
#   dhcp-range=10.1.31.100,10.1.31.150,255.255.255.0,12h
#   dhcp-option=option:router,10.1.31.1
#   dhcp-option=option:dns-server,10.1.31.1
#
# The dhcp-match / pxe-service / dhcp-boot lines stay the same.
# ============================================================================
