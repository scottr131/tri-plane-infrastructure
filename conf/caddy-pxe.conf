# Plain HTTP static serving for PXE 
#
# Serves:
#   http://node/boot.ipxe            - /srv/pxe/boot.ipxe
#   http://node/initrd-auto.img      - /srv/pxe/initrd-auto.img
#   http://node/nodes/<mac>.cfg      - /srv/pxe/nodes/<mac>.cfg
#   http://node/mirror/...           - /srv/slackware/slackware64-current/...
#   http://node/tagsets/<set>/...    - /srv/slackware/tagsets/<set>/<series>/tagfile
#
# Run as a standalone Caddy instance:  caddy run --config caddy-pxe.conf
# (Or substitute any static web server — e.g. `python3 -m http.server` per dir.)

:80 {
	# Slackware Mirror
	handle_path /mirror/* {
		root * /srv/slackware/slackware64-current
		file_server
	}

	# Slackware tag file sets
	handle_path /tagsets/* {
		root * /srv/slackware/tagsets
		file_server
	}

	# PXE 
	handle {
		root * /srv/pxe
		file_server
	}
}
